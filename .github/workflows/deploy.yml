name: Production Build & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Sign Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Static Code Analysis (Linter & Type Checking)
        run: dart analyze .

      - name: Run Automated Test Suite
        run: flutter test --coverage

      - name: Configure Production Signing Keystore
        run: |
          cd android
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD || 'charusat2026' }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD || 'charusat2026' }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS || 'upload' }}" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/upload-keystore.jks
          elif [ ! -f "app/upload-keystore.jks" ]; then
            keytool -genkeypair -v -keystore app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass charusat2026 -keypass charusat2026 -dname "CN=SmartStudent, OU=AIML, O=CHARUSAT, L=Changa, ST=Gujarat, C=IN"
          fi

      - name: Build Production Signed APK
        run: flutter build apk --release

      - name: Build Production Android App Bundle (AAB for Google Play Store)
        run: flutter build appbundle --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-student-companion-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-student-companion-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
